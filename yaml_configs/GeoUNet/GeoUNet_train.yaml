# =========================
# GENERAL OPTIONS
# =========================
dataset_cerra: "data/CERRA"
dataset_era5: "data/ERA5"
model: GeoUNet                   # Model architecture
subset_ds: 0                      # 0 = full dataset, >0 = subset size
seed: 32
n_workers: 64                     # Dataloader workers
load: null
restore_opt: 1                    # 0 = do not restore optimizer
precision: "16-mixed"             # 32 | 16 | 16-mixed | bf16
eval: null                        # val | test | null → train
wandb_project: null
run_name: "GeoUNet"
regression_net: null
gridtype: null
num_ensembles: 1
output_variables: null            # List of vars to predict
save_preds_path: null
resume: null
# =========================
# DATASET SETTINGS
# =========================
img_in_channels: 6
img_out_channels: 6
img_resolution: [350, 350]
# =========================
# MODEL SETTINGS
# =========================
N_grid_channels: 4
embedding_type: zero
model_channels: 64
channel_mult: [1, 2, 2, 2]
attn_resolutions: [16]
model_type: SongUNet
checkpoint_level: 0
# =========================
# TRAINING SETTINGS
# =========================
val_interval: 1
lr: 8.0e-4
epochs: 300
batch_size: 32
lr_decay: 1
lr_rampup: 0
